<div id="page5">
<form id="formulaire">
  <div>
    <label for="comname">Nom de la coopérative</label>
    <input
      type="text"
      name="comname"
      id="comname"
      placeholder="Nom de votre coopérative"
      required
    />
  </div>

  <div>
    <label for="representant">Nom du représentant</label>
    <input
      type="text"
      name="representant"
      id="representant"
      placeholder="Nom et prénom"
      required
    />
  </div>

  <div>
    <label for="email">Adresse e-mail</label>
    <input
      type="email"
      name="email"
      id="email"
      placeholder="TaawonAfrica@gmail.com"
      required
    />
  </div>

  <div>
    <label for="tel">Téléphone</label>
    <input  type="tel" id="tel" name="tel" required pattern="^(\+212|0)[5-7][0-9]{8}$" placeholder="ex : 06, +212"/> 
  </div>

  <div>
    <label for="city">Ville / Région</label>
    <input
      type="text"
      name="city"
      id="city"
      placeholder="Ex. : Nador, Oriental"
      required
    />
  </div>

  <div>
    <label for="secteur">Secteur artisanal</label>
    <select name="secteur" id="secteur" required>
      <option value="">Choisir un secteur</option>
      <option value="tissage">Tissage et tapis</option>
      <option value="poterie">Poterie et céramique</option>
      <option value="zellige">Zellige</option>
      <option value="cuir">Cuir</option>
      <option value="vannerie">Vannerie</option>
      <option value="argan">Argan et produits du terroir</option>
      <option value="autre">Autre</option>
    </select>
  </div>

  <div>
    <label for="description">Présentation de la coopérative</label>
    <textarea
      name="description"
      id="description"
      rows="5"
      placeholder="Présentez votre coopérative..."
      required
    ></textarea>
  </div>
  
  <button type="submit"> submit ↗</button>
</form>
